      - name: Convert SVG to PNG
        run: |
          # Method 1: Using rsvg-convert (simple and reliable)
          rsvg-convert -h 2396 console.svg > console.png
          
          # Alternative method if rsvg-convert fails
          if [ ! -f console.png ]; then
            # Create a simple Node.js script to convert SVG to PNG
            cat > convert.js <<'SCRIPT'
            const fs = require('fs');
            const puppeteer = require('puppeteer');
            
            (async () => {
              const browser = await puppeteer.launch({
                headless: 'new',
                args: ['--no-sandbox', '--disable-setuid-sandbox']
              });
              const page = await browser.newPage();
              
              const svgContent = fs.readFileSync('console.svg', 'utf8');
              const html = `
                <html>
                <head>
                  <style>
                    body { margin: 0; padding: 0; }
                  </style>
                </head>
                <body>
                  ${svgContent}
                </body>
                </html>
              `;
              
              await page.setContent(html);
              await page.setViewport({ width: 1200, height: 2396 });
              await page.screenshot({ 
                path: 'console.png',
                fullPage: true,
                omitBackground: false
              });
              
              await browser.close();
            })();
            SCRIPT
            
            node convert.js
          fi

